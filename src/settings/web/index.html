<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dexmenu</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
  <!-- one layout (docs/plans/05-PLAN-settings-windows.md 3.6): its name (a change renames it on Save), Save, Save as,
       Close; the theme switch at the right -->
  <header>
    <label>Layout <input type="text" id="layoutName" title="A new name renames the layout when it is saved"></label>
    <span id="dirty" hidden>changed</span>
    <button id="save">Save</button>
    <button id="saveAs">Save as...</button>
    <button id="close">Close</button>
    <span class="grow"></span>
    <span id="themeSwitch" class="segmented" title="Light, dark, or as Windows' apps are"></span>
  </header>
  <div id="error" hidden></div>
  <main id="panes">
    <section class="pane" id="rulesPane">
      <h2>Rules, in priority order</h2>
      <div class="hint">Drag to change; the first rule that finds an item gets it.</div>
      <ol id="rules"></ol>
    </section>
    <div class="splitter" title="Drag to resize"></div>
    <section class="pane" id="cardsPane">
      <div class="cards-wrap">
        <!-- the gutter: collapse / expand all at its top, each card with a menu's fold toggle level with the card -->
        <div class="gutter-col" id="cardsGutter">
          <div class="gutter-top">
            <button class="toggle" id="collapseAll" title="Collapse every card with a menu">-</button>
            <button class="toggle" id="expandAll" title="Expand every card with a menu">+</button>
          </div>
        </div>
        <div class="cards-main">
          <h2>Cards
            <span class="grow"></span>
            <button id="addTop" draggable="true" title="Drag to where the new card goes; a click adds it at the end"></button>
            <button id="addDivider" draggable="true" title="Drag to where the new divider goes; a click adds it at the end"></button></h2>
          <div id="cards"></div>
        </div>
      </div>
    </section>
    <div class="splitter" title="Drag to resize"></div>
    <section class="pane" id="cardPane">
      <h2 id="cardHeading">Card</h2>
      <div id="card"></div>
    </section>
  </main>
  <dialog id="nameDialog">
    <form method="dialog">
      <label>Save the layout as <input id="nameInput" required pattern="[^\\/:*?&quot;&lt;&gt;|]+"></label>
      <menu><button value="cancel" formnovalidate>Cancel</button> <button value="ok">Save</button></menu>
    </form>
  </dialog>
  <script src="theme.js"></script>
  <script src="layout-model.js"></script>
  <script src="editor.js"></script>
</body>
</html>
