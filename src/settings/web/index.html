<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dexmenu</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
  <header>
    <span class="grow"></span>
    <label>Layout <select id="layouts"></select></label>
    <span id="dirty" hidden>changed</span>
    <button id="save">Save</button>
    <button id="saveAs">Save as...</button>
    <button id="activate">Make active</button>
  </header>
  <div id="registration">
    <span id="regState"></span>
    <span class="grow"></span>
    <label title="Explorer loads Dexmenu, or lets go of it, only when it starts; its open windows close"><input type="checkbox" id="restart" checked> Restart Explorer afterwards</label>
    <button id="register">Register</button>
    <button id="unregister">Unregister</button>
  </div>
  <div id="error" hidden></div>
  <div id="ownKind" hidden>This kind of right-click uses the default layout. <button id="makeOwn">Give it its own</button></div>
  <main id="panes">
    <section class="pane" id="rulesPane">
      <h2>Rules, in priority order</h2>
      <div class="hint">Drag to change; the first rule that finds an item gets it.</div>
      <ol id="rules"></ol>
    </section>
    <section class="pane" id="cardsPane">
      <h2>Cards <span class="hint" id="kindName"></span> <button id="addTop" title="A new card at the end of the menu">+ Card</button></h2>
      <div id="cards"></div>
    </section>
    <section class="pane" id="cardPane">
      <h2 id="cardHeading">Card</h2>
      <div id="card"></div>
    </section>
  </main>
  <dialog id="nameDialog">
    <form method="dialog">
      <label>Save the layout as <input id="nameInput" required pattern="[^\\/:*?&quot;&lt;&gt;|]+"></label>
      <menu><button value="cancel" formnovalidate>Cancel</button> <button value="ok">Save</button></menu>
    </form>
  </dialog>
  <script src="layout-model.js"></script>
  <script src="editor.js"></script>
</body>
</html>
