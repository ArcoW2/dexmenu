<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dexmenu</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
  <!-- one layout (docs/plans/05-PLAN-settings-windows.md 3.6): its name (a change renames it on Save), Save, Save as,
       Close; the theme switch at the right -->
  <header>
    <label>Layout <input type="text" id="layoutName" title="A new name renames the layout when it is saved"></label>
    <span id="dirty" hidden>changed</span>
    <button id="save">Save</button>
    <button id="saveAs">Save as...</button>
    <button id="close">Close</button>
    <span class="grow"></span>
    <button id="themeSwitch" class="theme"></button>
  </header>
  <div id="error" hidden></div>
  <main id="panes">
    <section class="pane" id="rulesPane">
      <h2>Rules, in priority order</h2>
      <div class="hint">Drag to change; the first rule that finds an item gets it.</div>
      <ol id="rules"></ol>
    </section>
    <div class="splitter" title="Drag to resize"></div>
    <section class="pane" id="cardsPane">
      <div class="cards-wrap">
        <!-- the gutter: collapse / expand all at its top, each card with a menu's fold toggle level with the card -->
        <div class="gutter-col" id="cardsGutter">
          <div class="gutter-top">
            <button class="toggle" id="collapseAll" title="Collapse every card with a menu">-</button>
            <button class="toggle" id="expandAll" title="Expand every card with a menu">+</button>
          </div>
        </div>
        <div class="cards-main">
          <h2>Cards
            <span class="grow"></span>
            <button id="addTop" draggable="true" title="Drag to where the new card goes; a click adds it at the end"></button>
            <button id="addDivider" draggable="true" title="Drag to where the new divider goes; a click adds it at the end"></button>
            <button id="addNote" draggable="true" title="A note: text in the menu, no button. Drag to where it goes; a click adds it at the end"></button>
            <button id="addOwn" title="Dexmenu's own item: Edit menu... or Windows' menu; a click adds it at the end">+ Dexmenu</button>
            <button id="addMostUsed" draggable="true" title="The most used row: the items chosen most. Drag to where it goes; a click adds it at the end">+ Most used</button></h2>
          <div id="cards"></div>
        </div>
      </div>
    </section>
    <div class="splitter" title="Drag to resize"></div>
    <section class="pane" id="cardPane">
      <h2 id="cardHeading">Card</h2>
      <div id="card"></div>
    </section>
    <div class="splitter" title="Drag to resize"></div>
    <!-- the preview: its bar here; its area is a window the DLL draws the menu into, placed over #previewArea -->
    <section class="pane" id="previewPane">
      <h2>Preview</h2>
      <div id="previewBar">
        <label>Right-click on <select id="pvKind"></select></label>
        <span id="pvWhere">
          in <span id="pvFolder" class="folder"></span>
          <button id="pvPick" title="The folder in which the preview's right-click is">Folder...</button>
          <button id="pvNoFolder" title="No folder: the items that kind of right-click showed (the seen items)">x</button>
        </span>
        <select id="pvItem" hidden></select>
        <details id="pvItems" hidden><summary id="pvItemsText"></summary><div id="pvItemsList"></div></details>
        <button id="pvLast" title="The kind, folder and items of the last right-click Dexmenu showed its menu for">Last right-click</button>
        <div id="pvNotMeant" class="notmeant" hidden>This layout is not meant for this kind</div>
        <div id="pvError" class="problem" hidden></div>
      </div>
      <div id="previewArea"></div>
    </section>
  </main>
  <dialog id="nameDialog">
    <form method="dialog">
      <label>Save the layout as <input id="nameInput" required pattern="[^\\/:*?&quot;&lt;&gt;|]+"></label>
      <menu><button value="cancel" formnovalidate>Cancel</button> <button value="ok">Save</button></menu>
    </form>
  </dialog>
  <script src="theme.js"></script>
  <script src="layout-model.js"></script>
  <script src="editor.js"></script>
</body>
</html>
